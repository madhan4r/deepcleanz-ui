name: CI and CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'revamp/**'
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  ci:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        env:
          # Build does not connect to the database; real values are set on the server.
          PAYLOAD_SECRET: ci-build-only
          DATABASE_URL: mongodb://127.0.0.1:27017/ci
        run: npm run build

  # The old deploy copied a static build/ folder. The new site is a Next.js server
  # (website + admin + API) and needs Node on the server (e.g. `npm start` under pm2)
  # or Vercel. Deployment is switched off until the hosting choice is made — see README.
  deploy:
    name: Deploy (disabled until hosting is set up)
    runs-on: ubuntu-latest
    needs: ci
    if: false
    steps:
      - run: echo "See README → Deploy"
