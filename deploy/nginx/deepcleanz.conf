# /etc/nginx/sites-available/deepcleanz.conf  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# HTTPS certificates: sudo certbot --nginx -d deepcleanz.com -d www.deepcleanz.com  (certbot adds the ssl lines)

upstream deepcleanz_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

# http → https (certbot can also manage this block)
server {
  listen 80;
  listen [::]:80;
  server_name deepcleanz.com www.deepcleanz.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://deepcleanz.com$request_uri; }
}

# www → bare domain, one hop (Google sees a single canonical host)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.deepcleanz.com;
  # ssl_certificate / ssl_certificate_key: added by certbot
  return 301 https://deepcleanz.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name deepcleanz.com;
  # ssl_certificate / ssl_certificate_key: added by certbot

  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 12m;   # admin photo uploads
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
  gzip_min_length 1024;

  # Old API — keep only while the old backend still runs on this server (open decision).
  # location /api/v1/ { proxy_pass http://127.0.0.1:3001; proxy_set_header Host $host; }

  location / {
    proxy_pass http://deepcleanz_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # the booking rate limit reads this
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
